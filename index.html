<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>ASTREA™ — Tu comercio, más simple.</title>
  <meta
    name="description"
    content="ASTREA™ te ofrece una plataforma con herramientas pensadas para gestionar tus productos y pedidos."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>

<body>
  <header class="site-header" data-header>
    <div class="site-header__inner">
      <a class="brand" href="#mas-simple" aria-label="ASTREA™ — volver al inicio">
        <img
          class="brand__logo"
          src="assets/logo.png"
          alt="ASTREA™"
          data-logo
        >
        <span class="brand__fallback" data-logo-fallback>ASTREA™</span>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a class="main-nav__link is-active" href="#mas-simple">MÁS SIMPLE</a>
        <a class="main-nav__link" href="#astrea-ndive">ASTREA-NDIVE</a>
        <a class="main-nav__link" href="#herramientas">HERRAMIENTAS</a>
        <a class="main-nav__link" href="#contacto">CONTACTO</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero section-anchor" id="mas-simple" aria-labelledby="hero-title">
      <div class="shell">
        <div class="hero__intro">
          <h1 class="hero__title" id="hero-title">
            <span>Tu comercio,</span>
            <span class="hero__title-accent">más simple.</span>
          </h1>

          <div class="hero__copy">
            <p>
              <strong class="brand-word">ASTREA™</strong> te ofrece una plataforma
              con herramientas pensadas para gestionar tus productos y pedidos.
            </p>

            <p>
              Más autonomía para tu negocio y una experiencia más sencilla para
              tus clientes.
            </p>
          </div>
        </div>

        <div class="hero-media" data-hero-media>
          <img
            class="hero-media__image"
            src="assets/image1.jpg"
            alt="Presentación visual de un comercio utilizando ASTREA™"
            data-hero-image
          >
          <div class="hero-media__fallback" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <button
    class="back-to-top"
    type="button"
    aria-label="Volver a Más Simple"
    title="Volver arriba"
    data-back-to-top
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/>
    </svg>
  </button>
</body>
</html>
